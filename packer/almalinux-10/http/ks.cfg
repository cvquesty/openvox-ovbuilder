# AlmaLinux 10 kickstart — ovbuilder golden (NO DHCP required)
#
# All packages + cleanup run in %post. Machine powers off when done so Packer
# (communicator=none) can convert-to-template without SSH or a guest IP.
#
# Day-2 identity (hostname, static IP, gateway, DNS) is NOT set here.
# ovbuilder injects that via cloud-init guestinfo at clone time.

text
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# No network during golden build — PDXC has no DHCP for build VMs.
# Link is present for vNIC hardware only; do not request a lease.
network --bootproto=none --device=link --onboot=no --noipv4 --noipv6
firewall --disabled
selinux --permissive
services --enabled="sshd,chronyd,vmtoolsd"

ignoredisk --only-use=sda
clearpart --all --initlabel --drives=sda
autopart --type=plain

rootpw --plaintext ChangeMe-BuildOnly!
user --name=almalinux --groups=wheel --password=ChangeMe-BuildOnly! --plaintext

bootloader --location=mbr --boot-drive=sda

# Power off (do NOT reboot) so Packer detects completion without SSH.
poweroff

%packages --ignoremissing
@^minimal-environment
open-vm-tools
cloud-init
cloud-utils-growpart
qemu-guest-agent
sudo
curl
wget
vim-minimal
tar
%end

%post --log=/root/ks-post.log --erroronfail
set -e

# Admin sudo (passwordless for lab goldens; tighten for production goldens)
echo 'almalinux ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/almalinux
chmod 440 /etc/sudoers.d/almalinux

# Tools + cloud-init must start on first clone boot
systemctl enable vmtoolsd.service 2>/dev/null || systemctl enable open-vm-tools.service 2>/dev/null || true
systemctl enable cloud-init.service cloud-init-local.service cloud-config.service cloud-final.service 2>/dev/null || true
systemctl enable sshd.service 2>/dev/null || true

# Prefer VMware guestinfo datasource for ovbuilder clone identity
mkdir -p /etc/cloud/cloud.cfg.d
cat >/etc/cloud/cloud.cfg.d/99-ovbuilder-vmware.cfg <<'EOF'
datasource_list: [ VMware, OVF, None ]
datasource:
  VMware:
    allow_raw_data: true
EOF

# --- Golden hygiene (same goals as packer/scripts/cleanup-linux.sh) ---
# Force cloud-init to re-run on first clone boot
if command -v cloud-init >/dev/null 2>&1; then
  cloud-init clean --logs --seed 2>/dev/null || cloud-init clean --logs 2>/dev/null || true
fi

# Unique machine-id per clone
truncate -s 0 /etc/machine-id 2>/dev/null || true
rm -f /var/lib/dbus/machine-id 2>/dev/null || true
ln -sf /etc/machine-id /var/lib/dbus/machine-id 2>/dev/null || true

# SSH host keys regenerate on first boot
rm -f /etc/ssh/ssh_host_* 2>/dev/null || true

# No residual network state from the build
rm -f /etc/sysconfig/network-scripts/ifcfg-* 2>/dev/null || true
rm -f /etc/NetworkManager/system-connections/* 2>/dev/null || true
rm -f /etc/netplan/*.yaml 2>/dev/null || true

# Leave interface unmanaged until cloud-init on clone
cat >/etc/NetworkManager/conf.d/99-ovbuilder-unmanaged.conf <<'EOF' 2>/dev/null || true
[keyfile]
unmanaged-devices=*,except:type:loopback
EOF

# Logs / history
rm -rf /var/log/* /tmp/* /var/tmp/* 2>/dev/null || true
rm -f /root/.bash_history /home/*/.bash_history 2>/dev/null || true

sync
%end
