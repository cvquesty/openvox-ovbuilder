# AlmaLinux 10 kickstart for ovbuilder golden image (Packer)
# Install from CDROM; network DHCP during build only.

text
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc

network --bootproto=dhcp --device=link --activate --onboot=on
firewall --disabled
selinux --permissive
services --enabled="sshd,chronyd,vmtoolsd"

# Disk: single root (template disk is thin; size set in Packer)
ignoredisk --only-use=sda
clearpart --all --initlabel
autopart --type=plain

rootpw --plaintext ChangeMe-BuildOnly!
user --name=almalinux --groups=wheel --password=ChangeMe-BuildOnly! --plaintext

bootloader --location=mbr
reboot

%packages --ignoremissing
@^minimal-environment
open-vm-tools
cloud-init
cloud-utils-growpart
qemu-guest-agent
sudo
curl
wget
vim-minimal
tar
%end

%post --erroronfail
echo 'almalinux ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/almalinux
chmod 440 /etc/sudoers.d/almalinux
systemctl enable vmtoolsd.service || systemctl enable open-vm-tools.service || true
systemctl enable cloud-init.service cloud-init-local.service cloud-config.service cloud-final.service || true
mkdir -p /etc/cloud/cloud.cfg.d
cat >/etc/cloud/cloud.cfg.d/99-ovbuilder-vmware.cfg <<'EOF'
datasource_list: [ VMware, OVF, None ]
datasource:
  VMware:
    allow_raw_data: true
EOF
%end
