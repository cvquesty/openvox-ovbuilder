# OV Builder web — SPA static files + /api reverse proxy
# Installed by web/install-web.sh. Placeholders __ROOT__ and __SERVER_NAME__
# are substituted at install time; defaults match /opt/ovbuilder on a
# dedicated box. TLS termination is left to the operator (another server
# block or a TLS proxy in front).

upstream ovbuilder_api {
    server 127.0.0.1:4567;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root __ROOT__/web/frontend/dist;
    index index.html;

    # Never serve hidden files (including a misplaced .env).
    location ~ /\. {
        deny all;
        return 404;
    }

    location /api/ {
        proxy_pass http://ovbuilder_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 16m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
