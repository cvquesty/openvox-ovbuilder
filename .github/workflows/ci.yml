name: ci

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.8.6"
      - run: ruff check --output-format=github .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - run: pytest -q

  web-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            web/backend/requirements.txt
            web/backend/requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r web/backend/requirements.txt -r web/backend/requirements-dev.txt
          pip install -e .
      - env:
          SECRET_KEY: test-secret-key-that-is-long-enough-32ch
        run: |
          cd web/backend && PYTHONPATH=. python -c "from app.main import app; print(app.title)"
      - env:
          SECRET_KEY: test-secret-key-that-is-long-enough-32ch
        run: |
          PYTHONPATH=web/backend python -m pytest -q web/backend/tests

  web-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform -chdir=terraform fmt -check -recursive -diff
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck -S warning install.sh web/install-web.sh packer/scripts/*.sh
